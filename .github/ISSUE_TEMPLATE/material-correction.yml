name: Material correction or update
description: Report an error, broken link, or requested update in released school material.
title: "[Material update]: "
labels: []
body:
  - type: input
    id: path
    attributes:
      label: Affected file or link
      placeholder: presentations/day-01-introduction/example.pdf
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs to change?
      description: Explain the issue and, where possible, provide the corrected information.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contributor or rights-holder contact (optional)

